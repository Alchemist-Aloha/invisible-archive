name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build APK
        timeout-minutes: 20
        run: |
          cd mobile
          flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
